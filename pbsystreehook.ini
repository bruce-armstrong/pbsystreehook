; pbsystreehook.ini - configures the System Tree right-click menu items.
; Lives next to pbsystreehook.dll. Re-read on every right-click, so edits take effect
; immediately - no need to reload pbsystreehookload.exe or restart the IDE.
;
; Placeholders usable in Label and Args:
;   %o   object name              e.g.  pfc_n_cst_filesrv
;   %l   library as shown         e.g.  pfcapsrv.pbl (C:\...\pfc libs)
;   %L   full .pbl path           e.g.  C:\...\pfc libs\pfcapsrv.pbl
;   %n   newline (handy in :msgbox)
;   %%   a literal percent sign
;
; Command is either a program (exe/bat/cmd/anything ShellExecute can open) or a
; built-in action:
;   :clipboard   copy Args to the clipboard
;   :msgbox      show Args in a message box
; Args are passed on the command line (quote paths that may contain spaces).
; Dir (optional) sets the working directory for a program.

[pbsystreehook]
Items=3

; Turn on a debug log by setting Log=1. LogFile is optional; if omitted the log
; is written to pbsystreehook.log next to the DLL.
Log=0
; LogFile=C:\Users\me\Downloads\pbsystreehook\pbsystreehook.log

[Item1]
Label=Run my tool on "%o"
Command=C:\Tools\mytool.exe
Args="%o" "%L"
; Dir=C:\Tools

[Item2]
Label=Copy object name
Command=:clipboard
Args=%o

[Item3]
Label=Show object + library
Command=:msgbox
Args=Object:  %o%nLibrary: %L
